<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Game</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Memory Game</h1>
  <div class="game-info">
    <p>Temps : <span id="timer">0 s</span></p>
    <p id="score-stats">Aucun score enregistré.</p>
  </div>
  <button id="restart-button" type="button">Nouvelle partie</button>
  <div id="game-board"></div>
  <p id="game-message" class="game-message" aria-live="polite"></p>
</body>
</html>
