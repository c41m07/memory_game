services:
  memory-game:
    build:
      context: .
    image: memory-game:local
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_network"
      - "traefik.http.routers.memory-game.rule=Host(`${MEMORY_GAME_HOST:-memory-game.localhost}`)"
      - "traefik.http.routers.memory-game.entrypoints=${TRAEFIK_ENTRYPOINT:-web}"
      - "traefik.http.services.memory-game.loadbalancer.server.port=80"

networks:
  traefik:
    name: traefik_network
    external: true
